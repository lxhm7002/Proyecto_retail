<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HardwareStore - SaaS Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: #f8f9fa; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        .navbar-saas { background-color: #18181b; border-bottom: 1px solid #27272a; padding: 1rem 2rem; }
        .card-saas { background-color: #18181b; border: 1px solid #27272a; border-radius: 12px; transition: all 0.2s ease; }
        .card-saas:hover { border-color: #ff6600; transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255, 102, 0, 0.1); }
        .product-img { height: 200px; object-fit: contain; background: #ffffff; padding: 15px; border-radius: 12px 12px 0 0; }
        .btn-orange { background-color: #ff6600; color: white; font-weight: 600; border-radius: 8px; }
        .btn-orange:hover { background-color: #e55c00; color: white; }
        .modal-content { background-color: #18181b; color: white; border: 1px solid #27272a; }
        .form-control { background-color: #27272a; border: 1px solid #3f3f46; color: white; }
        .form-control:focus { background-color: #27272a; color: white; border-color: #ff6600; box-shadow: none; }
    </style>
</head>
<body>

    <!-- NAVBAR CORPORATIVA -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-saas sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-white" href="#"><span style="color: #ff6600;"><i class="fas fa-cube me-2"></i>Hardware</span>Store</a>
            
            <div class="d-flex align-items-center gap-3">
                <!-- Zona de Autenticación Dinámica -->
                <div id="auth-container">
                    <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#authModal">
                        <i class="fas fa-user me-1"></i> Iniciar Sesión / Registrarse
                    </button>
                </div>
                
                <div id="user-container" class="d-none align-items-center gap-3">
                    <span class="text-secondary small">Hola, <strong id="user-display" class="text-white"></strong></span>
                    <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Salir</button>
                </div>

                <!-- Botón Carrito con Contador -->
                <button class="btn btn-dark border-secondary position-relative px-3" onclick="abrirCarro()">
                    <i class="fas fa-shopping-cart text-warning"></i> Carro
                    <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL / VITRINA -->
    <div class="container my-5">
        <div class="row mb-4">
            <div class="col">
                <h1 class="h3 fw-bold">Componentes Disponibles</h1>
                <p class="text-secondary">Selecciona los productos para agregarlos al carro y procesar tu orden con transacciones seguras.</p>
            </div>
        </div>

        <div class="row" id="product-grid">
            <!-- Renderizado dinámico vía JS -->
        </div>
    </div>

    <!-- MODAL DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
    <div class="modal fade" id="authModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Acceso a la Plataforma</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-secondary small">Usuario</label>
                        <input type="text" id="modal-user" class="form-control" placeholder="Ingrese su usuario">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary small">Contraseña</label>
                        <input type="password" id="modal-pass" class="form-control" placeholder="••••••••">
                    </div>
                    <div class="d-grid gap-2">
                        <button onclick="ejecutarLogin()" class="btn btn-orange">Iniciar Sesión</button>
                        <button onclick="ejecutarRegistro()" class="btn btn-outline-secondary">Registrar nueva cuenta</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DEL CARRITO DE COMPRAS -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold"><i class="fas fa-shopping-cart me-2"></i>Tu Carro de Compras</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cart-items-list" class="list-group mb-3 bg-transparent">
                        <!-- Items del carro -->
                    </div>
                    <div class="d-grid">
                        <button onclick="procesarCheckout()" class="btn btn-orange py-2">Procesar Pago (Checkout Atómico)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS DE FUNCIONALIDAD -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            verificarEstadoSesion();
            cargarProductos();
            actualizarContadorCarro();
        });

        async function cargarProductos() {
            try {
                const res = await fetch('http://127.0.0.1:8000/api/products/');
                const products = await res.json();
                const grid = document.getElementById('product-grid');
                grid.innerHTML = '';

                products.forEach(p => {
                    const sinStock = p.stock <= 0;
                    grid.innerHTML += `
                        <div class="col-md-3 mb-4">
                            <div class="card card-saas h-100 shadow-sm">
                                <img src="${p.image || 'https://via.placeholder.com/200'}" class="card-img-top product-img" alt="${p.name}">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title text-white fw-bold h6">${p.name}</h5>
                                    <h4 class="text-white fw-bold my-2">$${p.price}</h4>
                                    <p class="text-secondary small flex-grow-1">${p.description ? p.description.substring(0, 60) + '...' : ''}</p>
                                    <div class="d-flex justify-content-between align-items-center mt-2 mb-3">
                                        <span class="small text-muted">Stock:</span>
                                        <span class="badge bg-secondary">${p.stock} un.</span>
                                    </div>
                                    <button onclick="agregarAlCarro(${p.id})" class="btn btn-orange w-100" ${sinStock ? 'disabled' : ''}>
                                        ${sinStock ? 'Agotado' : 'Agregar al Carro'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) { console.error("Error cargando productos", e); }
        }

        async function ejecutarLogin() {
            const username = document.getElementById('modal-user').value;
            const password = document.getElementById('modal-pass').value;
            try {
                const res = await fetch('http://127.0.0.1:8000/api/token/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('username', username);
                    bootstrap.Modal.getInstance(document.getElementById('authModal')).hide();
                    verificarEstadoSesion();
                    alert("¡Sesión iniciada correctamente!");
                } else { alert("Credenciales incorrectas."); }
            } catch (e) { console.error(e); }
        }

        async function ejecutarRegistro() {
            const username = document.getElementById('modal-user').value;
            const password = document.getElementById('modal-pass').value;
            try {
                const res = await fetch('http://127.0.0.1:8000/api/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) {
                    alert("¡Registro exitoso! Ya puedes iniciar sesión.");
                } else { alert("Error al registrar usuario."); }
            } catch (e) { console.error(e); }
        }

        function verificarEstadoSesion() {
            const token = localStorage.getItem('access_token');
            const username = localStorage.getItem('username');
            if (token && username) {
                document.getElementById('auth-container').classList.add('d-none');
                document.getElementById('user-container').classList.remove('d-none');
                document.getElementById('user-display').innerText = username;
            } else {
                document.getElementById('auth-container').classList.remove('d-none');
                document.getElementById('user-container').classList.add('d-none');
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            location.reload();
        }

        async function agregarAlCarro(productId) {
            const token = localStorage.getItem('access_token');
            if (!token) {
                alert("Debes iniciar sesión para agregar productos al carro.");
                new bootstrap.Modal(document.getElementById('authModal')).show();
                return;
            }
            try {
                const res = await fetch('http://127.0.0.1:8000/api/cart/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ product_id: productId })
                });
                if (res.ok) {
                    actualizarContadorCarro();
                    alert("¡Producto agregado al carro con éxito!");
                } else { alert("No se pudo agregar el producto."); }
            } catch (e) { console.error(e); }
        }

        async function actualizarContadorCarro() {
            const token = localStorage.getItem('access_token');
            if (!token) return;
            try {
                const res = await fetch('http://127.0.0.1:8000/api/cart/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const totalItems = data.items ? data.items.reduce((sum, item) => sum + item.quantity, 0) : 0;
                    document.getElementById('cart-badge').innerText = totalItems;
                }
            } catch (e) { console.error(e); }
        }

        async function abrirCarro() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                alert("Inicia sesión para ver tu carro.");
                new bootstrap.Modal(document.getElementById('authModal')).show();
                return;
            }
            try {
                const res = await fetch('http://127.0.0.1:8000/api/cart/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const list = document.getElementById('cart-items-list');
                    list.innerHTML = '';
                    if (!data.items || data.items.length === 0) {
                        list.innerHTML = '<p class="text-muted text-center my-3">Tu carro está vacío</p>';
                    } else {
                        data.items.forEach(item => {
                            list.innerHTML += `
                                <div class="list-group-item bg-dark text-white border-secondary d-flex justify-content-between align-items-center mb-2 rounded">
                                    <div>
                                        <h6 class="mb-0">${item.product_name}</h6>
                                        <small class="text-muted">Cant: ${item.quantity} | $${item.price} c/u</small>
                                    </div>
                                    <span class="badge bg-warning text-dark">$${item.price * item.quantity}</span>
                                </div>
                            `;
                        });
                    }
                    new bootstrap.Modal(document.getElementById('cartModal')).show();
                }
            } catch (e) { console.error(e); }
        }

        async function procesarCheckout() {
            const token = localStorage.getItem('access_token');
            try {
                const res = await fetch('http://127.0.0.1:8000/api/checkout/', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    alert("🎉 ¡Transacción atómica y compra realizada con éxito!");
                    bootstrap.Modal.getInstance(document.getElementById('cartModal')).hide();
                    location.reload();
                } else {
                    const err = await res.json();
                    alert("Error en el pago: " + (err.error || err.detail));
                }
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
