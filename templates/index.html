<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HardwareStore - SaaS Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-red: #dc2626; --primary-red-hover: #b91c1c; --bg-dark: #121212; --card-bg: #18181b; --border-color: #27272a; }
        body { background-color: var(--bg-dark); color: #f8f9fa; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        .navbar-saas { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; }
        .card-saas { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; transition: all 0.2s ease; }
        .card-saas:hover { border-color: var(--primary-red); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(220, 38, 38, 0.15); }
        .product-img { height: 200px; object-fit: contain; background: #ffffff; padding: 15px; border-radius: 12px 12px 0 0; }
        .btn-red { background-color: var(--primary-red); color: white; font-weight: 600; border-radius: 8px; border: none; }
        .btn-red:hover { background-color: var(--primary-red-hover); color: white; }
        .text-red { color: var(--primary-red) !important; }
        .badge-red { background-color: var(--primary-red) !important; }
        .desc-box { max-height: 42px; overflow: hidden; transition: max-height 0.5s ease; }
        .desc-box.expanded { max-height: 500px; transition: max-height 0.7s ease; }
        .btn-more { cursor: pointer; color: var(--primary-red); font-weight: bold; font-size: 0.85rem; text-decoration: none; }
        .btn-more:hover { color: var(--primary-red-hover); }
        .modal-content { background-color: var(--card-bg); color: white; border: 1px solid var(--border-color); }
        .form-control { background-color: #27272a; border: 1px solid #3f3f46; color: white; }
        .form-control:focus { background-color: #27272a; color: white; border-color: var(--primary-red); box-shadow: none; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-saas sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-white" href="#"><span class="text-red"><i class="fas fa-cube me-2"></i>Hardware</span>Store</a>
            <div class="d-flex align-items-center gap-3">
                <div id="auth-container">
                    <button class="btn btn-outline-light btn-sm" onclick="abrirLogin()">
                        <i class="fas fa-user me-1"></i> Iniciar Sesión / Registrarse
                    </button>
                </div>
                <div id="user-container" class="d-none align-items-center gap-3">
                    <span class="text-secondary small">Hola, <strong id="user-display" class="text-white"></strong></span>
                    <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Salir</button>
                </div>
                <button class="btn btn-dark border-secondary position-relative px-3" onclick="abrirCarro()">
                    <i class="fas fa-shopping-cart text-red"></i> Carro
                    <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill badge-red">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- VITRINA DE PRODUCTOS -->
    <div class="container my-5">
        <h1 class="h3 fw-bold mb-4">Componentes Disponibles</h1>
        <div class="row" id="product-grid"></div>
    </div>

    <!-- MODAL 1: LOGIN -->
    <div class="modal fade" id="authModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Acceso a la Plataforma</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-secondary small">Usuario</label>
                        <input type="text" id="modal-user" class="form-control" placeholder="Ingrese su usuario">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary small">Contraseña</label>
                        <input type="password" id="modal-pass" class="form-control" placeholder="••••••••">
                    </div>
                    <div class="d-grid gap-2">
                        <button onclick="ejecutarLogin()" class="btn btn-red">Iniciar Sesión</button>
                        <button onclick="abrirRegistro()" class="btn btn-outline-secondary mt-2">¿No tienes cuenta? Registrar nueva cuenta</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 2: REGISTRO (Nueva Ventana) -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <!-- Agregamos un borde rojo para diferenciar la ventana -->
            <div class="modal-content p-4" style="border-color: var(--primary-red);">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Crear Nueva Cuenta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-secondary small">Nuevo Usuario</label>
                        <input type="text" id="reg-user" class="form-control" placeholder="Crea un nombre de usuario">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary small">Nueva Contraseña</label>
                        <input type="password" id="reg-pass" class="form-control" placeholder="Crea una contraseña segura">
                    </div>
                    <div class="d-grid gap-2">
                        <button onclick="ejecutarRegistro()" class="btn btn-red">Crear cuenta</button>
                        <button onclick="abrirLogin()" class="btn btn-link text-secondary text-decoration-none mt-2">Ya tengo cuenta, volver a Iniciar Sesión</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 3: CARRO -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold"><i class="fas fa-shopping-cart me-2 text-red"></i>Tu Carro</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cart-items-list" class="list-group mb-3 bg-transparent"></div>
                    <div class="d-grid">
                        <button onclick="procesarCheckout()" class="btn btn-red py-2">Procesar Pago (Atómico)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            verificarEstadoSesion();
            cargarProductos();
            actualizarContadorCarro();
        });

        // NAVEGACIÓN ENTRE VENTANAS (MODALES)
        function abrirLogin() {
            const regModalEl = document.getElementById('registerModal');
            if(regModalEl.classList.contains('show')) {
                bootstrap.Modal.getInstance(regModalEl).hide();
            }
            const authModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('authModal'));
            authModal.show();
        }

        function abrirRegistro() {
            const authModalEl = document.getElementById('authModal');
            if(authModalEl.classList.contains('show')) {
                bootstrap.Modal.getInstance(authModalEl).hide();
            }
            const regModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('registerModal'));
            regModal.show();
        }

        function toggleDesc(id, btnElement) {
            const box = document.getElementById(`desc-${id}`);
            if (box.classList.contains('expanded')) {
                box.classList.remove('expanded');
                btnElement.innerText = 'más...';
            } else {
                box.classList.add('expanded');
                btnElement.innerText = 'menos...';
            }
        }

        async function cargarProductos() {
            try {
                const res = await fetch('http://127.0.0.1:8000/api/products/');
                const products = await res.json();
                const grid = document.getElementById('product-grid');
                grid.innerHTML = '';

                products.forEach(p => {
                    const sinStock = p.stock <= 0;
                    const descText = p.description || 'Sin descripción disponible.';
                    const needsCollapse = descText.length > 55;

                    grid.innerHTML += `
                        <div class="col-md-3 mb-4">
                            <div class="card card-saas h-100 shadow-sm">
                                <img src="${p.image || 'https://via.placeholder.com/200'}" class="card-img-top product-img" alt="${p.name}">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title text-white fw-bold h6">${p.name}</h5>
                                    <h4 class="text-white fw-bold my-2">$${p.price}</h4>
                                    <div class="flex-grow-1 my-2">
                                        <div id="desc-${p.id}" class="desc-box text-secondary small">${descText}</div>
                                        ${needsCollapse ? `<a onclick="toggleDesc(${p.id}, this)" class="btn-more d-inline-block mt-1">más...</a>` : ''}
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <span class="small text-muted">Stock:</span>
                                        <span class="badge bg-secondary">${p.stock} un.</span>
                                    </div>
                                    <button onclick="agregarAlCarro(${p.id})" class="btn btn-red w-100" ${sinStock ? 'disabled' : ''}>
                                        ${sinStock ? 'Agotado' : 'Agregar al Carro'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        // LÓGICA DE REGISTRO
        async function ejecutarRegistro() {
            const username = document.getElementById('reg-user').value;
            const password = document.getElementById('reg-pass').value;
            if(!username || !password) { alert("Llena ambos campos"); return; }
            
            try {
                const res = await fetch('http://127.0.0.1:8000/api/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const textData = await res.text();
                if (res.ok) {
                    alert("✅ ¡Cuenta creada exitosamente! Por favor, inicia sesión con tus nuevos datos.");
                    // Limpiamos los campos y enviamos al usuario a la ventana de Login
                    document.getElementById('reg-user').value = '';
                    document.getElementById('reg-pass').value = '';
                    abrirLogin(); 
                } else {
                    try { alert("❌ Error: " + JSON.parse(textData).error); } 
                    catch(e) { alert("❌ Error interno del Servidor: " + textData); }
                }
            } catch (e) { alert("Falla de red."); }
        }

        // LÓGICA DE LOGIN
        async function ejecutarLogin() {
            const username = document.getElementById('modal-user').value;
            const password = document.getElementById('modal-pass').value;
            try {
                const res = await fetch('http://127.0.0.1:8000/api/token/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('username', username);
                    bootstrap.Modal.getInstance(document.getElementById('authModal')).hide();
                    verificarEstadoSesion();
                    actualizarContadorCarro();
                } else { alert("Credenciales incorrectas."); }
            } catch (e) { console.error(e); }
        }

        function verificarEstadoSesion() {
            const token = localStorage.getItem('access_token');
            const username = localStorage.getItem('username');
            if (token && username) {
                document.getElementById('auth-container').classList.add('d-none');
                document.getElementById('user-container').classList.remove('d-none');
                document.getElementById('user-display').innerText = username;
            } else {
                document.getElementById('auth-container').classList.remove('d-none');
                document.getElementById('user-container').classList.add('d-none');
            }
        }

        function cerrarSesion() { localStorage.clear(); location.reload(); }

        // LÓGICA DEL CARRO
        async function agregarAlCarro(productId) {
            const token = localStorage.getItem('access_token');
            if (!token) { abrirLogin(); return; }
            try {
                const res = await fetch('http://127.0.0.1:8000/api/cart/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ product_id: productId })
                });
                if (res.ok) {
                    actualizarContadorCarro();
                    alert("🛒 ¡Agregado al carro!");
                } else {
                    const err = await res.json();
                    alert("❌ " + err.error);
                }
            } catch (e) { alert("❌ Error de conexión."); }
        }

        async function eliminarDelCarro(productId) {
            const token = localStorage.getItem('access_token');
            try {
                const res = await fetch('http://127.0.0.1:8000/api/cart/', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ product_id: productId })
                });
                if (res.ok) {
                    abrirCarro();
                    actualizarContadorCarro();
                }
            } catch (e) { alert("Error al eliminar."); }
        }

        async function actualizarContadorCarro() {
            const token = localStorage.getItem('access_token');
            if (!token) return;
            try {
                const res = await fetch('http://127.0.0.1:8000/api/cart/', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    const total = data.items ? data.items.reduce((s, i) => s + i.quantity, 0) : 0;
                    document.getElementById('cart-badge').innerText = total;
                }
            } catch (e) {}
        }

        async function abrirCarro() {
            const token = localStorage.getItem('access_token');
            if (!token) { abrirLogin(); return; }
            try {
                const res = await fetch('http://127.0.0.1:8000/api/cart/', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    const list = document.getElementById('cart-items-list');
                    list.innerHTML = '';
                    if (!data.items || data.items.length === 0) {
                        list.innerHTML = '<p class="text-muted text-center my-3">Tu carro está vacío</p>';
                    } else {
                        data.items.forEach(item => {
                            list.innerHTML += `
                                <div class="list-group-item bg-dark text-white border-secondary d-flex justify-content-between align-items-center mb-2 rounded">
                                    <div>
                                        <h6 class="mb-0">${item.product_name}</h6>
                                        <small class="text-muted">Cant: ${item.quantity} | $${item.price} c/u</small>
                                    </div>
                                    <div class="d-flex align-items-center gap-3">
                                        <span class="badge badge-red">$${item.price * item.quantity}</span>
                                        <button onclick="eliminarDelCarro(${item.product})" class="btn btn-sm btn-outline-danger border-0">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    bootstrap.Modal.getOrCreateInstance(document.getElementById('cartModal')).show();
                }
            } catch (e) { console.error(e); }
        }

        async function procesarCheckout() {
            const token = localStorage.getItem('access_token');
            try {
                const res = await fetch('http://127.0.0.1:8000/api/checkout/', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    alert("🎉 ¡Transacción exitosa! Tu pedido está en camino.");
                    location.reload();
                } else {
                    const err = await res.json();
                    alert("Error: " + (err.error || "Falla desconocida"));
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
